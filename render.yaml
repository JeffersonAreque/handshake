# Render Blueprint. Free plan: the local disk resets on every restart, so
# milestones and screenshots are stored in Turso (TURSO_* vars).
services:
  - type: web
    name: handshake
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set these manually in the Render dashboard. Add GEMINI_API_KEY first,
      # then AI_PROVIDER=gemini: with AI_PROVIDER=gemini and no key the
      # server refuses to start (it never falls back to the mock silently).
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
      # Optional, defaults to gemini-2.5-flash
      - key: AI_MODEL
        sync: false
