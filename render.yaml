# Render Blueprint. Free plan: the local disk resets on every restart, so
# milestones and screenshots are stored in Turso (TURSO_* vars).
services:
  - type: web
    name: handshake
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: mock
